name: ci

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      # CI has no .env: the example file carries placeholder values, which is all the
      # production build needs to compile and all the demo build ever uses.
      - run: cp .env.example .env && node scripts/gen-env.js
      - name: Unit tests
        run: npm run test:ci
      - name: Pulse tests
        run: npm run test:pulse
      - name: Production build
        run: npx ng build
      - name: Firebase CLI (emulators for the rules tests)
        run: npm install -g firebase-tools
      - name: Firestore + Storage rules tests
        run: npm run test:rules
      - name: Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: End-to-end (demo build)
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results
          retention-days: 7
