<div class="auth-screen">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-emoji">🌿</div>
      <h1>Trip Planner</h1>
      <p class="auth-sub">Sign in to your account</p>
    </div>

    <form class="auth-form" (ngSubmit)="submit()" #f="ngForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input
          id="username"
          type="text"
          [(ngModel)]="username"
          name="username"
          placeholder="Enter your username"
          autocomplete="username"
          autocapitalize="none"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            [(ngModel)]="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          />
          <button type="button" class="eye-btn" (click)="showPassword.set(!showPassword())" tabindex="-1">
            {{ showPassword() ? '🙈' : '👁️' }}
          </button>
        </div>
      </div>

      @if (error()) {
        <div class="auth-error">{{ error() }}</div>
      }

      <button type="submit" class="btn btn-primary auth-btn" [disabled]="loading()">
        {{ loading() ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>

    <div class="auth-footer">
      <p>Have an invite code? <a routerLink="/join">Join the trip</a></p>
    </div>
  </div>

  <p class="version-tag">🌿 Layn's Leaf {{ version }}<br><span class="build-date">{{ buildDate }}</span></p>
</div>
