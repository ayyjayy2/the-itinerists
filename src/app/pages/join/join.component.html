<div class="auth-screen">
  <div class="auth-card">

    @if (step() === 'validating') {
      <div class="auth-header">
        <app-brand [mark]="48" [showWordmark]="false" />
        <h1>Joining the Trip</h1>
        <p class="auth-sub">Checking your invite…</p>
      </div>
      <div class="loading-overlay">
        <div class="spinner"></div>
      </div>
    }

    @if (step() === 'invalid') {
      <div class="auth-header">
        <app-brand [mark]="48" [showWordmark]="false" />
        <h1>The Itinerists</h1>
      </div>
      <div class="auth-error">{{ codeError() }}</div>
      <div class="auth-footer">
        <p><a routerLink="/home">Back to Home</a></p>
      </div>
    }

  </div>
</div>
