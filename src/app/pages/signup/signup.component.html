<div class="auth-screen">
  <div class="auth-card">
    <div class="auth-header">
      <app-brand [mark]="50" [showWordmark]="false" />
      <h1>Create your account</h1>
      <p class="auth-sub">Set up your profile to start planning</p>
    </div>

    <form class="auth-form" (ngSubmit)="submit()">

      <div class="form-group">
        <label>Your Name</label>
        <input
          type="text"
          [(ngModel)]="displayName"
          name="displayName"
          placeholder="e.g. Alayna"
          required
        />
      </div>

      <div class="form-group">
        <label>Pick an Emoji</label>
        <div class="emoji-grid">
          @for (emoji of emojiOptions; track emoji) {
            <button
              type="button"
              class="emoji-btn"
              [class.selected]="avatarEmoji === emoji"
              (click)="selectEmoji(emoji)"
            >{{ emoji }}</button>
          }
        </div>
      </div>

      <div class="form-group">
        <label>Pick a Color</label>
        <div class="color-grid">
          @for (c of colorOptions; track c) {
            <button
              type="button"
              class="color-btn"
              [class.selected]="color === c"
              [style.background]="c"
              (click)="selectColor(c)"
            ></button>
          }
        </div>
      </div>

      <div class="form-group">
        <label>Username</label>
        <input
          type="text"
          [(ngModel)]="username"
          name="username"
          placeholder="Lowercase, no spaces"
          autocapitalize="none"
          autocomplete="username"
          required
        />
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="input-wrap">
          <input
            [type]="showPassword() ? 'text' : 'password'"
            [(ngModel)]="password"
            name="password"
            placeholder="At least 6 characters"
            autocomplete="new-password"
            required
          />
          <button type="button" class="eye-btn" (click)="showPassword.set(!showPassword())" tabindex="-1">
            {{ showPassword() ? '🙈' : '👁️' }}
          </button>
        </div>
      </div>

      <div class="form-group">
        <label>Confirm Password</label>
        <div class="input-wrap">
          <input
            [type]="showPassword() ? 'text' : 'password'"
            [(ngModel)]="confirmPass"
            name="confirmPass"
            placeholder="Re-enter password"
            autocomplete="new-password"
            required
          />
        </div>
      </div>

      @if (error()) {
        <div class="auth-error">{{ error() }}</div>
      }

      <button type="submit" class="btn btn-primary auth-btn" [disabled]="loading()">
        {{ loading() ? 'Creating account…' : 'Create account' }}
      </button>
    </form>

    <div class="auth-footer">
      <p class="auth-hint">Have an invite code? You'll use it next.</p>
      <p>Already have an account? <a routerLink="/login">Sign in</a></p>
    </div>
  </div>

  <p class="version-tag">🌿 Layn's Leaf {{ version }}<br><span class="build-date">{{ buildDate }}</span></p>
</div>
