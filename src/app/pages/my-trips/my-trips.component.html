<div class="page-container">
  <div class="trips-header">
    <h1><app-icon name="trips" [size]="22" /> My Trips</h1>
    <button class="btn btn-primary" (click)="newTrip()">+ New Trip</button>
  </div>

  @if (loading()) {
    <p class="muted">Loading your trips…</p>
  } @else if (error()) {
    <div class="alert-error">{{ error() }}</div>
  } @else if (trips().length === 0) {
    <div class="card empty">
      <div class="empty-emoji">🧳</div>
      <p>You're not part of any trips yet.</p>
      <button class="btn btn-primary" (click)="newTrip()">Create your first trip</button>
    </div>
  } @else {
    <div class="trip-grid">
      @for (trip of trips(); track trip.id) {
        <div class="trip-cell">
          <button class="trip-card" [class.active]="isActive(trip)" (click)="open(trip)">
            <div class="trip-card-top">
              <span class="trip-name">{{ trip.name }}</span>
              @if (isActive(trip)) { <span class="badge badge-active">Active</span> }
              @if (trip.archived) { <span class="badge badge-archived">Archived</span> }
            </div>
            <div class="trip-line"><app-icon name="pin" [size]="15" /> {{ trip.destination }}</div>
            <div class="trip-line"><app-icon name="itinerary" [size]="15" /> {{ dateRange(trip) }}</div>
            <div class="trip-meta"><app-icon name="people" [size]="15" /> {{ trip.memberCount }} · {{ trip.currency }}</div>
          </button>
          <button class="btn btn-ghost btn-sm invite-btn" (click)="invite(trip)" [disabled]="invitingId() === trip.id">
            @if (copiedId() === trip.id) { ✓ Invite link copied }
            @else if (invitingId() === trip.id) { Generating… }
            @else { <app-icon name="link" [size]="14" /> Invite }
          </button>
        </div>
      }
    </div>
    @if (inviteError()) { <div class="alert-error">{{ inviteError() }}</div> }
  }
</div>
