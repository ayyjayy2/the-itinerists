<div class="onboard-screen">
  <div class="onboard-card">

    <div class="onboard-header">
      <app-brand [mark]="50" [showWordmark]="false" />
      <h1>Hey{{ currentUser()?.name ? ', ' + currentUser()!.name : '' }}!</h1>
      <p class="onboard-sub">Let's get your first trip going.</p>
    </div>

    <!-- Choice menu -->
    @if (mode() === 'choose') {
      <div class="onboard-options">
        <button class="option-card" (click)="createTrip()">
          <span class="option-icon">🧳</span>
          <span class="option-text">
            <span class="option-title">Set up a trip</span>
            <span class="option-desc">Start a new trip and invite others</span>
          </span>
          <span class="option-arrow">→</span>
        </button>

        <button class="option-card" (click)="openCodeEntry()">
          <span class="option-icon">🎟️</span>
          <span class="option-text">
            <span class="option-title">I have an invite code</span>
            <span class="option-desc">Join a trip someone shared with you</span>
          </span>
          <span class="option-arrow">→</span>
        </button>
      </div>

      <button class="later-link" (click)="doThisLater()">Do this later</button>
    }

    <!-- Invite-code entry -->
    @if (mode() === 'code') {
      <form class="code-form" (ngSubmit)="joinWithCode()">
        <div class="form-group">
          <label>Invite Code</label>
          <input
            type="text"
            [(ngModel)]="inviteCode"
            name="inviteCode"
            placeholder="Enter your invite code"
            autocapitalize="characters"
            style="text-transform: uppercase; letter-spacing: 0.15em;"
            required
          />
        </div>

        @if (error()) {
          <div class="onboard-error">{{ error() }}</div>
        }

        <button type="submit" class="btn btn-primary onboard-btn" [disabled]="joining()">
          {{ joining() ? 'Joining…' : 'Join trip' }}
        </button>
        <button type="button" class="later-link" (click)="backToChoices()">← Back</button>
      </form>
    }

  </div>
</div>
