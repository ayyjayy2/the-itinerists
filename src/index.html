<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>The Itinerists</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#8BAF7C">
  <meta name="description" content="Your group trip planning companion">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Caprasimo&display=swap" rel="stylesheet">
</head>
<body>
  <style>
    /* Shown only while the app's code is still downloading; Angular replaces
       this the moment it boots. Fades in after 300ms so fast loads never see it. */
    .splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
              background: #F8F4EF; opacity: 0; animation: splash-in 0s 300ms forwards; }
    .splash-spinner { width: 28px; height: 28px; border: 3px solid #EDE5D8; border-top-color: #8BAF7C;
                      border-radius: 50%; animation: splash-spin 0.8s linear infinite; }
    @keyframes splash-in { to { opacity: 1; } }
    @keyframes splash-spin { to { transform: rotate(360deg); } }  </style>
  <app-root><div class="splash" role="status" aria-label="Loading"><div class="splash-spinner"></div></div></app-root>
  <noscript>Please enable JavaScript to use this app.</noscript>
</body>
</html>
